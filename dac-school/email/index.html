<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Connect Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Registration</h2>
        
        <form id="registrationForm" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div id="messageBox" class="hidden rounded-md p-3 text-sm font-medium border"></div>

            <button type="submit" id="submitBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                Submit
            </button>
        </form>
    </div>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Your specific Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCut-Qi7scoHnjHyE8UBuN53PHWnMMKqSE",
            authDomain: "sitee-f6a0c.firebaseapp.com",
            databaseURL: "https://sitee-f6a0c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sitee-f6a0c",
            storageBucket: "sitee-f6a0c.firebasestorage.app",
            messagingSenderId: "284183052545",
            appId: "1:284183052545:web:ef85ecc7be844cede8db00",
            measurementId: "G-HZHS31QH07"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Define safe application boundaries
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let currentUser = null;

        // UI Elements
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('messageBox');

        // Helper function for UI messages
        function showMessage(msg, isError = false) {
            messageBox.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200', 'bg-red-50', 'text-red-800', 'border-red-200');
            messageBox.classList.add(
                isError ? 'bg-red-50' : 'bg-green-50', 
                isError ? 'text-red-800' : 'text-green-800',
                isError ? 'border-red-200' : 'border-green-200',
                'border'
            );
            messageBox.textContent = msg;
        }

        // Initialize Authentication (Required before any Firestore operations)
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                showMessage("Database connectivity issue. Please try reloading.", true);
            }
        };

        initAuth();

        // Listen to Auth State
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
        });

        // Form Submit Handler
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            messageBox.classList.add('hidden');

            if (!currentUser) {
                showMessage("Establishing secure connection... Please try clicking submit again in a moment.", true);
                return;
            }

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!name || !email) {
                showMessage("Please ensure all fields are filled completely.", true);
                return;
            }

            // Update UI State
            submitBtn.disabled = true;
            submitBtn.textContent = "Processing Details...";

            try {
                // Strict databasing path for storing public records
                const leadsRef = collection(db, 'artifacts', appId, 'public', 'data', 'youtube_leads');
                
                await addDoc(leadsRef, {
                    name: name,
                    email: email,
                    userId: currentUser.uid,
                    registeredAt: new Date().toISOString()
                });

                showMessage("Success! Your registration has been received.");
                document.getElementById('registrationForm').reset();
            } catch (error) {
                console.error("Error writing document: ", error);
                showMessage("Failed to submit registration. Please check your database rules and permissions.", true);
            } finally {
                // Reset UI State
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Registration";
            }
        });
    </script>
</body>
</html>
