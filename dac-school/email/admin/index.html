<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Registrations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between bg-white p-6 rounded-lg shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Registration Leads</h1>
                <p class="text-sm text-gray-500 mt-1">Manage and view all registered users.</p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center space-x-4">
                <div class="bg-blue-50 text-blue-700 px-4 py-2 rounded-md border border-blue-100">
                    Total Leads: <span id="leadCount" class="font-bold">0</span>
                </div>
                <button id="copyEmailsBtn" class="flex items-center justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors disabled:opacity-50">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    Copy All Emails
                </button>
            </div>
        </div>

        <!-- Notification Box -->
        <div id="notificationBox" class="hidden transition-all duration-300 rounded-md p-4 text-sm font-medium border text-center"></div>

        <!-- Data Table -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email Address</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Registration Date</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="3" class="px-6 py-8 text-center text-gray-500">
                                <svg class="animate-spin h-5 w-5 mx-auto text-blue-500 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                Connecting to database...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Your specific Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCut-Qi7scoHnjHyE8UBuN53PHWnMMKqSE",
            authDomain: "sitee-f6a0c.firebaseapp.com",
            databaseURL: "https://sitee-f6a0c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sitee-f6a0c",
            storageBucket: "sitee-f6a0c.firebasestorage.app",
            messagingSenderId: "284183052545",
            appId: "1:284183052545:web:ef85ecc7be844cede8db00",
            measurementId: "G-HZHS31QH07"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let currentUser = null;
        let allEmails = [];

        // UI Elements
        const tableBody = document.getElementById('leadsTableBody');
        const leadCountEl = document.getElementById('leadCount');
        const copyEmailsBtn = document.getElementById('copyEmailsBtn');
        const notificationBox = document.getElementById('notificationBox');

        // Show Notification
        function showNotification(msg, isError = false) {
            notificationBox.textContent = msg;
            notificationBox.className = `transition-all duration-300 rounded-md p-4 text-sm font-medium border text-center block ${isError ? 'bg-red-50 text-red-800 border-red-200' : 'bg-green-50 text-green-800 border-green-200'}`;
            
            setTimeout(() => {
                notificationBox.classList.add('hidden');
            }, 3000);
        }

        // Initialize Authentication
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                tableBody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Authentication failed. Please reload.</td></tr>`;
            }
        };

        initAuth();

        // Listen to Auth State and Fetch Data
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                fetchLeads();
            }
        });

        // Fetch leads from Firestore in real-time
        function fetchLeads() {
            if (!currentUser) return;

            const leadsRef = collection(db, 'artifacts', appId, 'public', 'data', 'youtube_leads');
            
            // Listen for real-time updates
            onSnapshot(leadsRef, (snapshot) => {
                let html = '';
                allEmails = [];
                
                // Fetch and sort data in memory to avoid complex query indexing issues
                let leadsData = [];
                snapshot.forEach((doc) => {
                    leadsData.push({ id: doc.id, ...doc.data() });
                });

                // Sort by date (newest first)
                leadsData.sort((a, b) => new Date(b.registeredAt) - new Date(a.registeredAt));

                if (leadsData.length === 0) {
                    html = `<tr><td colspan="3" class="px-6 py-8 text-center text-gray-500">No registrations found yet.</td></tr>`;
                } else {
                    leadsData.forEach((data) => {
                        allEmails.push(data.email);
                        const dateObj = new Date(data.registeredAt);
                        const formattedDate = !isNaN(dateObj) ? dateObj.toLocaleString() : 'N/A';

                        html += `
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${escapeHtml(data.name || 'Unknown')}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${escapeHtml(data.email || 'No email')}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formattedDate}</td>
                            </tr>
                        `;
                    });
                }

                tableBody.innerHTML = html;
                leadCountEl.textContent = leadsData.length;
                copyEmailsBtn.disabled = leadsData.length === 0;

            }, (error) => {
                console.error("Error fetching leads:", error);
                tableBody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Error loading data. Check console for details.</td></tr>`;
            });
        }

        // Helper to prevent XSS in table output
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Copy all emails logic using robust document.execCommand
        copyEmailsBtn.addEventListener('click', () => {
            if (allEmails.length === 0) {
                showNotification("No emails to copy yet.", true);
                return;
            }

            const commaSeparatedEmails = allEmails.join(', ');

            // Create a temporary textarea to hold the text for copying
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = commaSeparatedEmails;
            document.body.appendChild(tempTextArea);
            
            // Select and copy
            tempTextArea.select();
            tempTextArea.setSelectionRange(0, 99999); // For mobile devices
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showNotification(`Successfully copied ${allEmails.length} email(s) to clipboard!`);
                } else {
                    showNotification("Failed to copy. Please try manually.", true);
                }
            } catch (err) {
                console.error("Copy failed:", err);
                showNotification("Clipboard access denied by browser.", true);
            }
            
            // Clean up
            document.body.removeChild(tempTextArea);
        });

    </script>
</body>
</html>
